version: "2"

run:
  go: "1.27.3"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - modernize
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    depguard:
      rules:
        # Shared execution policies stay SDK-free and consume core contracts.
        client-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/transport/client/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/transport/client$
            - github.com/nostosx/kitx/backoff$
        loader-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/cache/loader/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/cache/loader$
            - github.com/nostosx/kitx/singleflight$
        # Selectors use only standard library, core and kitx packages.
        selector-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/selector/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/selector/
            - github.com/nostosx/kitx/backoff$
        # Middleware may also compose the two SDK-free no-op backends.
        middleware-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/middleware/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/middleware/
            - github.com/nostosx/kitx/backoff$
            - github.com/nostosx/servex-contrib/metrics/noop$
            - github.com/nostosx/servex-contrib/tracing/noop$
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build requests from fixed URLs against in-process servers.
      - path: _test\.go
        linters:
          - noctx
      # Test helpers keep parameters that read better at the call site even
      # when every current caller passes the same value, and test callbacks
      # implement signatures whose error result they never need.
      - path: _test\.go
        linters:
          - unparam
      # Tests compare errors with == to assert that the exact value is
      # passed through unchanged; errors.Is would also accept a wrapped one.
      - path: _test\.go
        linters:
          - errorlint
        text: "comparing with [=!]= will fail on wrapped errors"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/nostosx
