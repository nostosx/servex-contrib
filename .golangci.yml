version: "2"

run:
  go: "1.27.3"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - modernize
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    depguard:
      rules:
        login-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/auth/login/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nostosx/servex-contrib/auth/oauth2$
            - github.com/nostosx/servex-contrib/auth/oidc$
            - github.com/nostosx/servex-contrib/middleware/auth$
            - github.com/nostosx/servex-contrib/session$
            - golang.org/x/oauth2$
        oauth2-redis-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/auth/oauth2redis/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nostosx/servex-contrib/auth/oauth2$
            - github.com/redis/go-redis/v9$
        lifecycle-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/lifecycle/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nostosx/servex/app$
        oauth2-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/auth/oauth2/**"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/oauth2$
            - golang.org/x/oauth2/
        password-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/auth/password/**"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/crypto/argon2$
        s3-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/storage/s3/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/aws/aws-sdk-go-v2/
        goose-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/database/goose/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/pressly/goose/v3$
        cron-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/scheduler/cron/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/robfig/cron/v3$
            - github.com/nostosx/servex/app$
        coordination-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/coordination/etcd/**"
            - "!$test"
          allow:
            - $gostd
            - go.etcd.io/etcd/client/v3$
            - go.etcd.io/etcd/client/v3/concurrency$
        cors-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/transport/cors/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/rs/cors$
        session-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/session/**"
            - "!**/servex-contrib/session/redis/**"
            - "!$test"
          allow:
            - $gostd
        session-redis-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/session/redis/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/redis/go-redis/v9$
            - github.com/nostosx/servex-contrib/session$
        gorm-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/database/gorm/**"
            - "!$test"
          allow:
            - $gostd
            - gorm.io/gorm$
            - gorm.io/gorm/logger$
            - gorm.io/driver/postgres$
            - github.com/jackc/pgx/v5$
            - github.com/jackc/pgx/v5/stdlib$
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/database/sql$
        jwt-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/auth/jwt/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/golang-jwt/jwt/v5$
        # Optional validation SDKs belong only to their owning adapter modules.
        playground-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/validation/playground/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/validation/playground$
            - github.com/go-playground/validator/v10$
        protovalidate-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/validation/protovalidate/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/validation/protovalidate$
            - buf.build/go/protovalidate$
            - buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go/
            - google.golang.org/protobuf/
        rate-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/ratelimit/rate/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - golang.org/x/time/rate$
        # Shared execution policies stay SDK-free and consume core contracts.
        client-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/transport/client/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/transport/client$
            - github.com/nostosx/kitx/backoff$
        loader-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/cache/loader/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/cache/loader$
            - github.com/nostosx/kitx/singleflight$
        # Selectors use only standard library, core and kitx packages.
        selector-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/selector/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/selector/
            - github.com/nostosx/kitx/backoff$
        # Middleware may also compose the two SDK-free no-op backends.
        middleware-dependencies:
          list-mode: strict
          files:
            - "**/servex-contrib/middleware/**"
          allow:
            - $gostd
            - github.com/nostosx/servex/
            - github.com/nostosx/servex-contrib/middleware/
            - github.com/nostosx/kitx/backoff$
            - github.com/nostosx/servex-contrib/metrics/noop$
            - github.com/nostosx/servex-contrib/tracing/noop$
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build requests from fixed URLs against in-process servers.
      - path: _test\.go
        linters:
          - noctx
      # Test helpers keep parameters that read better at the call site even
      # when every current caller passes the same value, and test callbacks
      # implement signatures whose error result they never need.
      - path: _test\.go
        linters:
          - unparam
      # Tests compare errors with == to assert that the exact value is
      # passed through unchanged; errors.Is would also accept a wrapped one.
      - path: _test\.go
        linters:
          - errorlint
        text: "comparing with [=!]= will fail on wrapped errors"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/nostosx
