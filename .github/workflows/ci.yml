name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: v2.15.0

defaults:
  run:
    shell: bash

# Every module and integration resolves published dependencies without overrides.
# Preserve the checkout name because depguard uses the servex-contrib directory.
jobs:
  unit:
    name: Check (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          # BEGIN MODULES
          - auth/jwt
          - auth/login
          - auth/oidc
          - auth/oauth2
          - auth/oauth2redis
          - auth/password
          - broker/kafka
          - broker/memory
          - broker/nats
          - broker/rabbitmq
          - cache/redis
          - cache/memory
          - cache/loader
          - config/consul
          - config/etcd
          - config/nacos
          - config/viper
          - coordination/etcd
          - database/gorm
          - database/goose
          - database/mongodb
          - database/sql
          - di/do
          - discovery/consul
          - discovery/memory
          - discovery/etcd
          - discovery/kubernetes
          - discovery/nacos
          - encoding/proto
          - encoding/json
          - encoding/yaml
          - jobqueue/asynq
          - jobqueue/memory
          - logger/slog
          - logger/zap
          - lifecycle
          - metrics/otel
          - metrics/noop
          - metrics/prometheus
          - middleware
          - ratelimit/rate
          - ratelimit/redis
          - selector
          - scheduler/cron
          - session
          - session/redis
          - storage/s3
          - tracing/otel
          - tracing/noop
          - transport/client
          - transport/connectx
          - transport/cors
          - transport/grpcx
          - transport/ssex
          - transport/websocketx
          - transport/httpx
          - validation/playground
          - validation/protovalidate
          - database/postgres
          - vector/pgvector
          - search/postgres
          - jobqueue/pgmq
          - scheduler/pgcron
          # END MODULES
    defaults:
      run:
        shell: bash
        working-directory: servex-contrib/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            servex-contrib/${{ matrix.module }}/go.mod
            servex-contrib/${{ matrix.module }}/go.sum
      - name: Check module (no external services)
        working-directory: servex-contrib
        env:
          CHECK_MODULE: ${{ matrix.module }}
        run: task check MODULES="$CHECK_MODULE"

  lint:
    name: Lint (Go 1.27.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            servex-contrib/**/go.mod
            servex-contrib/**/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Lint all modules
        working-directory: servex-contrib
        run: task lint

  vulncheck:
    name: Reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            servex-contrib/**/go.mod
            servex-contrib/**/go.sum
      - name: Install scanner outside the modules
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan all modules (normal and integration builds)
        working-directory: servex-contrib
        run: task vulncheck

  integration:
    name: Integration (${{ matrix.backend }})
    # MongoDB 8 refuses Linux 6.19+ (SERVER-121912); Ubuntu 22.04 uses kernel 6.8.
    runs-on: ${{ matrix.backend == 'mongodb' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # BEGIN INTEGRATIONS
          - backend: postgres-extensions
            modules: database/postgres vector/pgvector search/postgres jobqueue/pgmq scheduler/pgcron
          - backend: postgres
            modules: database/gorm database/goose
          - backend: s3
            modules: storage/s3
          - backend: kafka
            modules: broker/kafka
          - backend: nats
            modules: broker/nats
          - backend: rabbitmq
            modules: broker/rabbitmq
          - backend: redis
            modules: cache/redis jobqueue/asynq ratelimit/redis session/redis auth/oauth2redis
          - backend: mongodb
            modules: database/mongodb
          - backend: consul
            modules: config/consul discovery/consul
          - backend: etcd
            modules: config/etcd discovery/etcd coordination/etcd
          - backend: nacos
            modules: config/nacos discovery/nacos
            # END INTEGRATIONS
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            servex-contrib/**/go.mod
            servex-contrib/**/go.sum
      - name: Start disposable service and wait for readiness
        working-directory: servex-contrib
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash .github/scripts/start-service.sh "$BACKEND"
      - name: Run integration tests and reject skipped or absent tests
        working-directory: servex-contrib
        env:
          MODULES: ${{ matrix.modules }}
        run: task test INTEGRATION=true
      - name: Service logs
        if: failure()
        env:
          BACKEND: ${{ matrix.backend }}
        run: docker logs "servex-it-$BACKEND"
      - name: Remove disposable service
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = postgres-extensions ]; then
            fixture_env="$RUNNER_TEMP/servex-postgres-base.env"
            if [ -f "$fixture_env" ]; then bash servex-contrib/tests/postgres/fixture.sh down "$fixture_env"; fi
          elif docker container inspect "servex-it-$BACKEND" >/dev/null 2>&1; then
            docker rm -f -v "servex-it-$BACKEND"
          fi

  postgres-capabilities:
    name: PostgreSQL capabilities (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [general, timescale, citus, duckdb]
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: servex-contrib/**/go.sum
      - name: Install extensions in disposable upstream containers
        working-directory: servex-contrib
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash tests/postgres/fixture.sh up "$PROFILE" "$RUNNER_TEMP/servex-postgres.env"
      - name: Verify real capabilities and reject skipped tests
        working-directory: servex-contrib
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -a
          source "$RUNNER_TEMP/servex-postgres.env"
          set +a
          modules=database/postgres
          if [ "$PROFILE" = general ]; then modules="$modules vector/pgvector"; fi
          task test INTEGRATION=true MODULES="$modules"
      - name: Remove owned fixture resources
        if: always()
        working-directory: servex-contrib
        run: |
          fixture_env="$RUNNER_TEMP/servex-postgres.env"
          if [ -f "$fixture_env" ]; then bash tests/postgres/fixture.sh down "$fixture_env"; fi

  integration-kubernetes:
    name: Integration (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            servex-contrib/discovery/kubernetes/go.mod
            servex-contrib/discovery/kubernetes/go.sum
      - uses: helm/kind-action@v1
        with:
          cluster_name: servex-it
          wait: 120s
      - name: Verify cluster readiness and kubeconfig
        run: |
          test -s "$HOME/.kube/config"
          kubectl --context kind-servex-it wait --for=condition=Ready nodes --all --timeout=120s
      - name: Run Kubernetes integration tests and reject skips
        working-directory: servex-contrib
        run: |
          export SERVEX_IT_KUBECONFIG="$HOME/.kube/config"
          task test INTEGRATION=true MODULES=discovery/kubernetes
      # kind-action deletes the cluster in its post step, including on failure.
