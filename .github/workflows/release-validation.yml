name: Release validation

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'JSON array of module paths in this publication batch'
        required: true
        type: string
      integrations:
        description: 'JSON array of backend/modules objects for service checks'
        required: true
        default: '[]'
        type: string
      postgres_profiles:
        description: 'JSON array of PostgreSQL extension profiles'
        required: true
        default: '[]'
        type: string

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash
    working-directory: servex-contrib

jobs:
  module:
    name: Release check (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: servex-contrib/${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Validate published dependencies and module
        env:
          RELEASE_MODULE: ${{ matrix.module }}
        run: task check lint vulncheck MODULES="$RELEASE_MODULE"

  integration:
    if: inputs.integrations != '[]'
    name: Release integration (${{ matrix.backend }})
    # MongoDB 8 refuses Linux 6.19+ (SERVER-121912); Ubuntu 22.04 uses kernel 6.8.
    runs-on: ${{ matrix.backend == 'mongodb' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.integrations) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: servex-contrib/**/go.sum
      - uses: helm/kind-action@v1
        if: matrix.backend == 'kind'
        with:
          cluster_name: servex-release
          wait: 120s
      - name: Start disposable backend
        if: matrix.backend != 'kind'
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash .github/scripts/start-service.sh "$BACKEND"
      - name: Run service integration checks
        env:
          RELEASE_MODULES: ${{ matrix.modules }}
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = kind ]; then
            export SERVEX_IT_KUBECONFIG="$HOME/.kube/config"
            kubectl --context kind-servex-release wait --for=condition=Ready nodes --all --timeout=120s
          fi
          if [ "$BACKEND" = postgres-extensions ]; then
            set -a
            source "$RUNNER_TEMP/servex-postgres-base.env"
            set +a
          fi
          task test INTEGRATION=true MODULES="$RELEASE_MODULES"
      - name: Backend diagnostics
        if: failure() && matrix.backend != 'kind'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = postgres-extensions ]; then
            fixture_env="$RUNNER_TEMP/servex-postgres-base.env"
            if [ -f "$fixture_env" ]; then
              # shellcheck disable=SC1090
              source "$fixture_env"
              docker logs "$SERVEX_FIXTURE_NAME"
            fi
          else
            docker logs "servex-it-$BACKEND"
          fi
      - name: Remove disposable backend
        if: always() && matrix.backend != 'kind'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = postgres-extensions ]; then
            fixture_env="$RUNNER_TEMP/servex-postgres-base.env"
            if [ -f "$fixture_env" ]; then bash tests/postgres/fixture.sh down "$fixture_env"; fi
          elif docker container inspect "servex-it-$BACKEND" >/dev/null 2>&1; then
            docker rm -f -v "servex-it-$BACKEND"
          fi

  postgres-capabilities:
    if: inputs.postgres_profiles != '[]'
    name: Release PostgreSQL capabilities (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.postgres_profiles) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: servex-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: servex-contrib/**/go.sum
      - name: Install extensions in disposable upstream containers
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash tests/postgres/fixture.sh up "$PROFILE" "$RUNNER_TEMP/servex-postgres.env"
      - name: Verify real capabilities and reject skipped tests
        env:
          PROFILE: ${{ matrix.profile }}
          RELEASE_MODULES: ${{ inputs.modules }}
        run: |
          set -a
          source "$RUNNER_TEMP/servex-postgres.env"
          set +a
          modules=database/postgres
          if [ "$PROFILE" = general ] && [[ "$RELEASE_MODULES" == *'"vector/pgvector"'* ]]; then modules="$modules vector/pgvector"; fi
          task test INTEGRATION=true MODULES="$modules"
      - name: Remove owned fixture resources
        if: always()
        run: |
          fixture_env="$RUNNER_TEMP/servex-postgres.env"
          if [ -f "$fixture_env" ]; then bash tests/postgres/fixture.sh down "$fixture_env"; fi
